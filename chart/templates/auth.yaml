apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "daviddempsey-dev.fullname" . }}-auth
  labels:
    {{- include "daviddempsey-dev.labels" . | nindent 4 }}
data:
  oauth2-proxy.cfg: |
    http_address = "0.0.0.0:4180"
    provider = "oidc"
    provider_display_name = "Sentinel"
    oidc_issuer_url = {{ .Values.auth.issuer | quote }}
    redirect_url = "https://{{ .Values.host }}/oauth2/callback"
    scope = "openid profile offline_access"
    oidc_email_claim = "sub"
    user_id_claim = "sub"
    code_challenge_method = "S256"
    authenticated_emails_file = "/etc/oauth2-users/allowed-subjects"
    upstreams = ["http://127.0.0.1:8080/"]
    pass_host_header = false
    proxy_websockets = true
    reverse_proxy = true
    skip_provider_button = true
    cookie_name = "__Host-daviddempsey-dev"
    cookie_secure = true
    cookie_httponly = true
    cookie_samesite = "lax"
    cookie_expire = "8h"
    cookie_refresh = "15m"
    cookie_csrf_per_request = true
    request_logging = false
