apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "daviddempsey-dev.fullname" . }}
  labels:
    {{- include "daviddempsey-dev.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "daviddempsey-dev.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "daviddempsey-dev.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/auth: {{ include (print $.Template.BasePath "/auth.yaml") . | sha256sum }}
        checksum/content: {{ (.Files.Glob "files/*").AsConfig | sha256sum }}
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: site
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: site
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: site
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: site
            periodSeconds: 30
          volumeMounts:
            - name: site-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: site-content
              mountPath: /usr/share/nginx/html/styles.css
              subPath: styles.css
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
        - name: auth
          image: {{ .Values.auth.image | quote }}
          args: ["--config=/etc/oauth2-proxy/oauth2-proxy.cfg"]
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: auth-config
              mountPath: /etc/oauth2-proxy
              readOnly: true
            - name: auth-users
              mountPath: /etc/oauth2-users
              readOnly: true
      volumes:
        - name: site-content
          configMap:
            name: {{ include "daviddempsey-dev.fullname" . }}-site
        - name: nginx-config
          configMap:
            name: {{ include "daviddempsey-dev.fullname" . }}-nginx
        - name: auth-config
          configMap:
            name: {{ include "daviddempsey-dev.fullname" . }}-auth
        - name: auth-users
          secret:
            secretName: {{ .Values.auth.existingSecret }}
            items:
              - key: allowed-subjects
                path: allowed-subjects
