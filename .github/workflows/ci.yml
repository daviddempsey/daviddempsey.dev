name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: daviddempsey-dev
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --watchAll=false --runInBand
      - run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: check
    runs-on: daviddempsey-dev
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            memory=4g
            cpu-period=100000
            cpu-quota=100000
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/daviddempsey/daviddempsey-dev:${{ github.sha }}
            ghcr.io/daviddempsey/daviddempsey-dev:latest
          labels: |
            org.opencontainers.image.source=https://github.com/daviddempsey/daviddempsey.dev
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: azure/setup-helm@v4
      - run: helm lint chart
      - run: echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
      - run: helm package chart --version "0.1.${{ github.run_number }}" --app-version "$GITHUB_SHA"
      - run: helm push daviddempsey-dev-*.tgz oci://ghcr.io/daviddempsey/charts
